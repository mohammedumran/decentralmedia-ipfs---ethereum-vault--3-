<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="100" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>

  <!-- Decentralized Media Node Hexagon & Layers -->
  <!-- Outer Hexagon Nodes -->
  <g stroke="#06b6d4" stroke-width="3" opacity="0.6">
    <line x1="256" y1="96" x2="384" y2="170"/>
    <line x1="384" y1="170" x2="384" y2="318"/>
    <line x1="384" y1="318" x2="256" y2="392"/>
    <line x1="256" y1="392" x2="128" y2="318"/>
    <line x1="128" y1="318" x2="128" y2="170"/>
    <line x1="128" y1="170" x2="256" y2="96"/>
  </g>

  <!-- Network Nodes (IPFS Swarm Points) -->
  <circle cx="256" cy="96" r="10" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="384" cy="170" r="10" fill="#818cf8"/>
  <circle cx="384" cy="318" r="10" fill="#a78bfa"/>
  <circle cx="256" cy="392" r="10" fill="#38bdf8"/>
  <circle cx="128" cy="318" r="10" fill="#6366f1"/>
  <circle cx="128" cy="170" r="10" fill="#06b6d4"/>

  <!-- Center Layer 3 (Bottom Isometric Plate) -->
  <path d="M256 340 L350 286 L256 232 L162 286 Z" fill="#4338ca" opacity="0.5"/>
  <path d="M162 286 L256 340 L256 355 L162 301 Z" fill="#312e81"/>
  <path d="M350 286 L256 340 L256 355 L350 301 Z" fill="#1e1b4b"/>

  <!-- Center Layer 2 (Middle Isometric Plate) -->
  <path d="M256 270 L350 216 L256 162 L162 216 Z" fill="#0284c7" opacity="0.6"/>
  <path d="M162 216 L256 270 L256 285 L162 231 Z" fill="#0369a1"/>
  <path d="M350 216 L256 270 L256 285 L350 231 Z" fill="#075985"/>

  <!-- Center Layer 1 (Top Glowing Isometric Plate) -->
  <path d="M256 200 L350 146 L256 92 L162 146 Z" fill="url(#primaryGrad)" filter="url(#glow)"/>
  <path d="M162 146 L256 200 L256 215 L162 161 Z" fill="#0891b2"/>
  <path d="M350 146 L256 200 L256 215 L350 161 Z" fill="#4f46e5"/>

  <!-- Play Symbol / Media Vault Diamond in center -->
  <polygon points="244,130 278,146 244,162" fill="#ffffff" opacity="0.95"/>

  <!-- Text "saus" at bottom -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="#f8fafc" letter-spacing="4">
    SAUS
  </text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#22d3ee" letter-spacing="2">
    ANDROID • DECENTRALIZED
  </text>
</svg>
